<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>予約システム</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="public-page">
    <header class="site-header">
      <div>
        <p class="eyebrow">鍼灸と養生のご予約</p>
        <h1 id="clinicName">予約ページ</h1>
        <p id="description" class="lead"></p>
      </div>
      <a class="admin-link" href="/admin.html">管理画面</a>
    </header>

    <main class="layout">
      <section class="panel reservation-panel">
        <ol class="stepper" aria-label="予約の流れ">
          <li class="active" data-step-indicator="1"><span>1</span>メニュー</li>
          <li data-step-indicator="2"><span>2</span>日付</li>
          <li data-step-indicator="3"><span>3</span>時間</li>
          <li data-step-indicator="4"><span>4</span>お客様情報</li>
          <li data-step-indicator="5"><span>5</span>確認</li>
          <li data-step-indicator="6"><span>6</span>完了</li>
        </ol>

        <form id="bookingForm" class="form reservation-form">
          <section class="flow-card" data-flow-step="1">
            <p class="step-label">Step 1</p>
            <h2>メニュー選択</h2>
            <label>
              メニュー
              <select name="menuId" id="menuSelect" required></select>
            </label>

            <div id="optionSection" class="option-section">
              <h3>オプション</h3>
              <div id="optionList" class="option-list"></div>
            </div>

            <div class="menu-detail" id="menuDetail"></div>
          </section>

          <section class="flow-card calendar-section" data-flow-step="2">
            <p class="step-label">Step 2</p>
          <div class="section-heading">
            <div>
                <h2>日付選択</h2>
              <p>希望のメニューを選ぶと、予約できる日と時間が表示されます。</p>
            </div>
            <div class="calendar-controls">
              <button id="prevMonthButton" class="secondary-button" type="button">前月</button>
              <strong id="calendarTitle"></strong>
              <button id="nextMonthButton" class="secondary-button" type="button">翌月</button>
            </div>
          </div>

          <div class="calendar-weekdays">
            <span>日</span>
            <span>月</span>
            <span>火</span>
            <span>水</span>
            <span>木</span>
            <span>金</span>
            <span>土</span>
          </div>
          <div id="availabilityCalendar" class="availability-calendar"></div>
          </section>

          <section class="flow-card" data-flow-step="3">
            <p class="step-label">Step 3</p>
          <div class="slot-panel">
            <h3 id="selectedDateTitle">日付を選んでください</h3>
            <div id="slotList" class="slot-list"></div>
          </div>
          <div class="two-col">
            <label>
              希望日
              <input name="date" id="dateInput" type="date" required>
            </label>
            <label>
              希望時間
              <select name="time" id="timeSelect" required></select>
            </label>
          </div>
          </section>

          <section class="flow-card" data-flow-step="4">
          <p class="step-label">Step 4</p>
          <h3>お客様情報</h3>
          <label>
            お名前
            <input name="name" autocomplete="name" required>
          </label>
          <label>
            ふりがな
            <input name="kana">
          </label>
          <label>
            電話番号
            <input name="phone" autocomplete="tel" required>
          </label>
          <label>
            メールアドレス
            <input name="email" type="email" autocomplete="email">
          </label>
          <label>
            相談内容・気になること
            <textarea name="note" rows="5" placeholder="例：肩こり、腰痛、身体の重さ、眠りの浅さなど"></textarea>
          </label>

          <label class="consent-check">
            <input name="privacyConsent" type="checkbox" required>
            <span><a href="/privacy.html" target="_blank" rel="noopener">個人情報の取り扱い</a>に同意します</span>
          </label>
          </section>

          <section id="bookingReview" class="flow-card booking-review" data-flow-step="5" hidden></section>

          <div class="booking-actions">
            <button id="reviewButton" type="submit">予約内容を確認する</button>
            <button id="editBookingButton" class="secondary-button" type="button" hidden>内容を修正する</button>
          </div>
          <p id="formMessage" class="message" role="status"></p>
          <div id="confirmationActions" class="confirmation-actions" hidden></div>
        </form>
      </section>

      <aside class="panel subtle guidance-panel">
        <h2>ご案内</h2>
        <p id="notice"></p>
        <dl class="info-list">
          <div>
            <dt>受付時間</dt>
            <dd id="hours"></dd>
          </div>
          <div>
            <dt>定休日</dt>
            <dd id="closedDays"></dd>
          </div>
        </dl>
        <p class="aside-link"><a href="/privacy.html">個人情報の取り扱い</a></p>
      </aside>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
