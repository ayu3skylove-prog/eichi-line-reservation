<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>個人情報の取り扱い</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">個人情報保護方針</p>
        <h1>個人情報の取り扱い</h1>
        <p class="lead">予約時にお預かりする情報の取り扱いについて。</p>
      </div>
      <a class="admin-link" href="/">予約ページ</a>
    </header>
    <main class="admin-layout">
      <section class="panel document-panel">
        <h2>利用目的</h2>
        <p>お預かりしたお名前、電話番号、メールアドレス、相談内容は、予約管理、事前確認、連絡、施術・サービス提供のために利用します。</p>

        <h2>第三者提供</h2>
        <p>法令に基づく場合を除き、ご本人の同意なく第三者へ提供しません。</p>

        <h2>管理</h2>
        <p>予約情報は、必要な範囲で適切に管理し、不要になった情報は確認のうえ削除します。</p>

        <h2>注意事項</h2>
        <p>このページは運用開始前のひな形です。正式公開前に、所在地、事業者名、問い合わせ先、保存期間などを実態に合わせて整えてください。</p>
      </section>
    </main>
  </body>
</html>
